name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run zizmor
        run: |
          python -m pip install zizmor
          zizmor --persona=auditor .

  build:
    name: Build the typeface
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          brew install --cask fontforge
          ln -s /Applications/FontForge.app/Contents/Resources/opt/local/bin/fontforge /usr/local/bin/
          brew install fonttools
          pipx install gftools
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - name: Make TTF file
        run: make
        working-directory: macos
      - name: Upload typeface file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TTF file
          path: src/Sampradaya.ttf
          retention-days: 1
  test_macos:
    needs: build
    name: Compare rasterised images on MacOS
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Download typeface file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TTF file
          path: src
      - name: Install dependencies
        run: brew install imagemagick qt@6
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - name: Grab Alekhana
        run: |
          wget https://github.com/deepestblue/alekhana/releases/download/latest/alekhana_dist.zip
          unzip alekhana_dist.zip
      - name: Build and run test
        run: make test
        working-directory: macos
      - name: Upload test failure output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: Macos output directory
          path: macos/output
          retention-days: 1
  test_windows:
    needs: build
    name: Compare rasterised images on Windows
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Native Tools Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Download typeface file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TTF file
          path: src
      - name: Grab Alekhana
        run: |
          curl -s -o alekhana_dist.zip -L https://github.com/deepestblue/alekhana/releases/download/latest/alekhana_dist.zip
          tar -xf alekhana_dist.zip
      - name: Build and run test
        run: nmake test
        working-directory: windows
      - name: Upload test failure output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: Windows output directory
          path: windows/output
          retention-days: 1
  fontbakery:
    needs: build
    name: Run Fontbakery
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Download typeface file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TTF file
          path: src
      - name: Run fontbakery TTF checks
        uses: f-actions/font-bakery@76d618162a7cf7c514c36958d35f77fe442e7c9c # v1
        with:
          subcmd: check-universal
          args: "--html fontbakery.html --loglevel WARN --exclude-checkid nested_components --exclude-checkid unreachable-glyphs --exclude-checkid mark-chars"
          path: src/Sampradaya.ttf
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Fontbakery reports
          path: fontbakery.html
          retention-days: 1
