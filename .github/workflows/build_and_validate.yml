name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python environment
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Run zizmor
        run: |
          python -m pip install zizmor
          zizmor --persona=auditor .

  build:
    name: Build the typeface
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          brew install --cask fontforge
          ln -s /Applications/FontForge.app/Contents/Resources/opt/local/bin/fontforge /usr/local/bin/
          brew install fonttools
          pipx install gftools
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - name: Make TTF file
        run: make
        working-directory: macos
      - name: Upload typeface file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TTF file
          path: src/Sampradaya.ttf
          retention-days: 1
  test_macos:
    needs: build
    name: Compare rasterised images on MacOS
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download typeface file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TTF file
          path: src
      - name: Install dependencies
        run: brew install imagemagick qt@6
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - name: Grab Alekhana
        run: |
          wget https://github.com/deepestblue/alekhana/releases/download/latest/alekhana_dist.zip
          unzip alekhana_dist.zip
      - name: Build and run test
        run: make test
        working-directory: macos
      - name: Upload test failure output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: Macos output directory
          path: macos/output
          retention-days: 1
  test_windows:
    needs: build
    name: Compare rasterised images on Windows
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Native Tools Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Download typeface file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TTF file
          path: src
      - name: Grab Alekhana
        run: |
          curl -s -o alekhana_dist.zip -L https://github.com/deepestblue/alekhana/releases/download/latest/alekhana_dist.zip
          tar -xf alekhana_dist.zip
      - name: Build and run test
        run: nmake test
        working-directory: windows
      - name: Upload test failure output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: Windows output directory
          path: windows/output
          retention-days: 1
  fontbakery:
    needs: build
    name: Run Fontbakery
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python environment
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.9"
      - name: Download typeface file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TTF file
          path: src
      - name: Run fontbakery TTF checks
        uses: f-actions/font-bakery@96901b4792b6ddf2483a31bbc167a5e2622d35ca # v3.2.0
        with:
          subcmd: check-universal
          args: "--html fontbakery.html --loglevel WARN --exclude-checkid nested_components --exclude-checkid unreachable-glyphs --exclude-checkid mark-chars"
          path: src/Sampradaya.ttf
      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Fontbakery reports
          path: fontbakery.html
          retention-days: 1
